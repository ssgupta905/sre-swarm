[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sre-swarm"
version = "1.0.0"
description = "Terminal-based agentic SRE swarm CLI for Kubernetes incident response"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SRE Swarm" }]
dependencies = [
    "textual>=0.52",
    "click>=8.1",
    "httpx>=0.27",
    "kubernetes>=29.0",
    "pydantic>=2.7",
    "aiosqlite>=0.20",
    "PyYAML>=6.0",
    "structlog>=24.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=12.0",
]

[project.optional-dependencies]
# Optional legacy LLM backend; the default runtime uses Ollama and needs nothing here.
claude = ["claude-agent-sdk"]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
    "ruff",
]

[project.scripts]
sre-swarm = "sre_swarm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sre_swarm = ["tui/*.tcss", "web/static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
